<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Case</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="wrap">
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-fakenews"></section>
    <section class="view" id="view-aiimages"></section>
    <section class="view" id="view-phishing"></section>
  </div>

  <div class="welcome-modal-backdrop" id="welcomeModalBackdrop" hidden>
    <div class="welcome-modal" role="dialog" aria-modal="true" aria-labelledby="welcomeModalTitle">
      <div class="welcome-modal-header">
        <span class="chip">WELCOME</span>
      </div>
      <h2 id="welcomeModalTitle">Enter your team name</h2>
      <p>Start by entering your team name for this session. You can continue to all three tasks once you click “Start”.</p>
      <input class="team-input modal-input" id="welcomeTeamNameInput" placeholder="Team name" maxlength="60" />
      <div class="modal-actions">
        <button class="task-btn modal-start-btn" id="welcomeStartBtn">Start</button>
      </div>
      <a class="footer-admin-link modal-admin-link" href="admin.html">Judge? Go to the leaderboard, no team name needed</a>
    </div>
  </div>

  <footer class="app-footer">Cyber Case, a cybersecurity awareness challenge <a class="footer-admin-link" href="admin.html">Judge login</a></footer>

  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
